<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attract Studio illustration gallery</title><style>
:root{--bg:#F5F5F4;--fg:#0A0A0A;--card:#FFFFFF;--line:#E7E5E4}
body.dark{--bg:#0A0A0A;--fg:#FAFAF9;--card:#171717;--line:#292524}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;transition:background .2s}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:18px;margin:0}
button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;--il-bg:var(--card);--il-ink:var(--fg)}
.card.wide{grid-column:span 2}
.art{display:grid;place-items:center}
figcaption{margin-top:8px;font-size:12px} figcaption span{opacity:.6}
.il { width: 100%; height: auto; color: var(--il-ink, currentColor); --il-orange: #FF5A1F; }
.il .s  { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.il .o  { fill: var(--il-orange); }
.il .os { fill: none; stroke: var(--il-orange); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.il .i  { fill: currentColor; }
.il .f  { fill: currentColor; opacity: .14; }
.il .b  { fill: var(--il-bg, Canvas); }
.il .t  { stroke-width: 2; }
.il .d  { stroke-dasharray: 4 5; }
