name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (placeholder env, no real secrets in CI)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-for-ci-build-only

  database:
    name: RLS isolation and schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local Supabase: applies every migration in supabase/migrations.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Schema rules (pgTAP)
        run: supabase test db
      - name: Tenant isolation (real users through the REST API)
        run: npm run test:isolation
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Build the app against local Supabase
        run: |
          eval "$(supabase status -o env | sed -n 's/^API_URL=/export LOCAL_URL=/p;s/^ANON_KEY=/export LOCAL_ANON=/p;s/^SERVICE_ROLE_KEY=/export LOCAL_SERVICE=/p')"
          NEXT_PUBLIC_SUPABASE_URL="$LOCAL_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_ANON" \
          SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SERVICE" NEXT_PUBLIC_APP_URL=http://localhost:3111 npm run build
      - name: Browser end-to-end tests (auth, onboarding, MFA, team)
        run: npm run test:e2e
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
